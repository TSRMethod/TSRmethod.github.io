  # -------------------------------------------------------------------------
  # People
  # -------------------------------------------------------------------------
  - name: people
    label: People
    type: collection
    path: src/content/people
    format: json
    filename: '{fields.id}.json'
    view:
      primary: name
      fields: [name, role, status]
    fields:
      - name: id
        label: Identifier
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: >-
          Lowercase, words joined by hyphens, e.g. jane-smith. Used as the
          file name. Do not change it once the person has been added.
      - name: name
        label: Full name
        type: string
        required: true
      - name: role
        label: Role or title
        type: string
        required: true
      - name: affiliation
        label: Affiliation
        type: string
      - name: group
        label: Group
        type: select
        options:
          values: [faculty, postdoc, student, undergraduate, collaborator]
      - name: status
        label: Current or former member
        type: select
        options:
          values: [current, former]
        default: current
      - name: bio
        label: Biography
        type: text
      - name: email
        label: Email
        type: string
        description: >-
          Shown on the card as a mail icon, not as text. Leave empty if it
          should not be shown. Never enter a placeholder.
      - name: scholar
        label: Google Scholar profile
        type: string
        description: >-
          The full https:// address of the person's Google Scholar page, copied
          from the browser. Leave empty if they do not have one — the icon is
          only shown when there is a link behind it.
      - name: linkedin
        label: LinkedIn profile
        type: string
        description: >-
          The full https:// address of the person's LinkedIn page. Leave empty
          if they do not have one.
      - name: photo
        label: Photo
        type: image
      - name: order
        label: Sort position
        type: number
        description: Lower numbers appear first within a group.

  # -------------------------------------------------------------------------
  # Publications
  # -------------------------------------------------------------------------
  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: json
    filename: '{fields.id}.json'
    view:
      primary: title
      fields: [title, venue, year]
    fields:
      - name: id
        label: Identifier
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: >-
          Lowercase, hyphenated, e.g. kondra-2021-tsr-method. Used as the file
          name.
      - name: title
        label: Title
        type: text
        required: true
      - name: authors
        label: Authors
        type: string
        list: true
        description: One name per entry, in the order they appear on the paper.
      - name: venue
        label: Journal or conference
        type: string
      - name: year
        label: Year
        type: number
      - name: volume
        label: Volume
        type: string
      - name: issue
        label: Issue
        type: string
      - name: pages
        label: Pages
        type: string
        description: 'For example: 694–703'
      - name: doi
        label: DOI
        type: string
        description: 'For example: 10.1002/prot.26215 (no https:// prefix).'
      - name: abstract
        label: Abstract
        type: text
        description: >-
          Optional. Shown behind an "Abstract" toggle on the publications page.
          Leave it empty rather than pasting a placeholder.
      - name: order
        label: Sort position
        type: number
        description: >-
          Optional. Only used to order papers published in the same year;
          the list is always newest year first.

  # -------------------------------------------------------------------------
  # Software repositories
  # -------------------------------------------------------------------------
  - name: repositories
    label: Software
    type: collection
    path: src/content/repositories
    format: json
    filename: '{fields.id}.json'
    view:
      primary: name
      fields: [name, language, category]
    fields:
      - name: id
        label: Identifier
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      - name: name
        label: Repository name
        type: string
        required: true
      - name: url
        label: URL
        type: string
        required: true
        description: >-
          The repository's address on GitHub. Changing it here is all that is
          needed to point an entry at a different repository — including moving
          the main package to a new account or organisation later.
      - name: description
        label: Description
        type: text
        description: >-
          One or two sentences on what the code does. The software page is a
          directory, not a manual — installation and usage stay on the method
          pages.
      - name: language
        label: Language
        type: string
      - name: category
        label: Category
        type: select
        options:
          values: [core, historical, method, analysis, tooling]
        description: >-
          Where the entry appears: core is BioTSR itself, historical lists
          earlier implementations of methods BioTSR now runs, and analysis
          lists separate research tools. Historical and analysis entries are on
          the Earlier implementations and research code page.
      - name: kind
        label: What it is
        type: select
        options:
          values: [package, scripts]
        description: >-
          "package" for something a user installs, "scripts" for research code
          that is run where it sits. Shown on the entry, so nothing implies a
          maintained release where there is not one.
      - name: licence
        label: Licence
        type: string
        required: true
        description: >-
          The licence the repository states on GitHub, for example "MIT
          License". Write "No licence stated" if it has no licence file; do not
          guess one. Shown on the entry.
      - name: issuesUrl
        label: Issue tracker
        type: string
        description: >-
          Optional, and a commitment: setting it puts a "Report a problem" link
          on the entry, so only fill it in for a repository whose issues
          somebody actually reads.
      - name: order
        label: Sort position
        type: number
        description: Lower numbers appear first within a section.

      # ---- The released package: hidden, preserved, never editable here ----
      # The version, and everything derived from it (install commands, the
      # release and PyPI pages, pinned documentation links), changes with a
      # release, not with an editorial edit. A test holds the pinned commands
      # on every page to this version.
      - name: release
        type: object
        hidden: true
        fields:
          - name: package
            type: string
          - name: version
            type: string
          - name: date
            type: string
          - name: pythonVersions
            type: string
          - name: platforms
            type: string
      # Mirrors the released CITATION.cff: authors in its order, no DOI.
      - name: citation
        type: object
        hidden: true
        fields:
          - name: title
            type: string
          - name: authors
            type: object
            list: true
            fields:
              - name: given
                type: string
              - name: family
                type: string

  # -------------------------------------------------------------------------
  # BioTSR page text and Getting started
  # -------------------------------------------------------------------------
  # The prose of the two software pages, as Markdown. The pages' layout,
  # route and release facts are not here: the facts come from the BioTSR
  # record above, and every pinned command (biotsr==1.0.0) and documentation
  # link (blob/v1.0.0) is checked against that record by the test suite.
  - name: biotsr-page
    label: BioTSR page text
    type: file
    path: src/content/software/biotsr.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
        description: Used as the page description in search results.
      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown
  - name: get-started
    label: Getting started page
    type: file
    path: src/content/software/get-started.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
        description: Shown under the title, and used in search results.
      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown

  # -------------------------------------------------------------------------
  # Home page wording
  # -------------------------------------------------------------------------
  # What the home page SAYS. Not how it is built.
  #
  # There is deliberately no field here for a link target, a section order, a
  # component name or a colour: the sections, their links and their layout are
  # decided in React, and every list on the page (methods, tools, packages,
  # papers, faculty) is read from the content collections above. An editor
  # rewrites the prose and the button labels; they cannot point a button at a
  # page that does not exist, reorder the page, or turn this into a page
  # builder.
  #
  # Every field is required, because each one renders as visible text — an
  # emptied heading or button label would appear on the site as a blank. The
  # build fails instead, which means a bad save never reaches the live site.
  - name: home
    label: Home page
    type: file
    path: src/content/home.json
    format: json
    fields:
      - name: hero
        label: Opening section
        type: object
        fields:
          - name: lede
            label: Introduction
            type: text
            required: true
            description: >-
              The paragraph under the group name. Two or three sentences saying
              what the group does.
          - name: primaryCta
            label: Main button label
            type: string
            required: true
            description: Links to the TSR method page.
          - name: secondaryCta
            label: Second button label
            type: string
            required: true
            description: Links to Getting started with BioTSR.
      - name: researchVision
        label: Research vision
        type: object
        fields:
          - name: heading
            label: Section heading
            type: string
            required: true
          - name: question
            label: Scientific question
            type: text
            required: true
            description: >-
              The open research question, shown as the most prominent text in
              the section. Keep it a question — the site should not read as
              though the answer has been found.
          - name: body
            label: Short explanation
            type: text
            required: true
            description: >-
              One short paragraph on what the research is for. How TSR works is
              explained two sections further down, so this should not repeat
              it.
      - name: software
        label: BioTSR section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
            description: >-
              What BioTSR does, in two or three sentences. The version and the
              install command come from the BioTSR record in the Software
              collection.
          - name: highlights
            label: What it does, as short points
            type: text
            list: true
            description: >-
              Two to four short points, for example the calculation families and
              batch processing. Say only what BioTSR 1.0.0 actually does.
          - name: installLabel
            label: Label above the install command
            type: string
            required: true
          - name: getStartedCta
            label: Getting started button
            type: string
            required: true
          - name: softwareCta
            label: BioTSR page button
            type: string
            required: true
      - name: introduction
        label: What TSR is
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Explanation
            type: text
            required: true
            description: >-
              One sentence introducing the four-step diagram below it, which
              shows how the representation works and is drawn from a BioTSR
              calculation (it is not edited here). The hero has already said
              what TSR is, so this should not explain it again.
          - name: cta
            label: Link label
            type: string
            required: true
            description: Links to the TSR method page.
      - name: research
        label: Methods & research section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: methodsCard
            label: Scientific methods card
            type: text
            required: true
            description: One sentence. The card links to the methods on the Methods & research page.
          - name: analysisCard
            label: Analysis card
            type: text
            required: true
          - name: earlierCard
            label: Earlier implementations card
            type: text
            required: true
          - name: cta
            label: Link label
            type: string
            required: true
            description: Links to the Methods & research page.
      - name: publications
        label: Publications section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: cta
            label: Link label
            type: string
            required: true
            description: >-
              Links to the publications page. The three most recent papers are
              chosen automatically by year.
      - name: group
        label: Research group section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: cta
            label: Link label
            type: string
            required: true
            description: Links to the people page.
      - name: funding
        label: Funding & support
        type: object
        fields:
          - name: heading
            label: Section heading
            type: string
            required: true
          - name: primarySupport
            label: Primary funding statement
            type: text
            required: true
            description: >-
              Who funds the research, in a sentence. The award-by-award detail
              goes in Funding awards below, so this stays readable however
              many awards there are.
          - name: computingSupport
            label: Computing support
            type: text
            required: true
            description: >-
              Who provides the computing resources. Kept separate from the
              funding statement above so that a computing provider is not
              described as a funder.
          - name: detailsLabel
            label: Disclosure label
            type: string
            description: >-
              The wording on the button that reveals the awards and the
              acknowledgments. Leave this, the awards and the acknowledgments
              empty to hide the button entirely.
          - name: awards
            label: Funding awards
            type: object
            list: true
            description: >-
              One entry per award. Awards from the same organisation are
              grouped under it automatically — do not type a heading, and do
              not use line breaks to lay anything out.
            fields:
              - name: funder
                label: Funding organization
                type: string
                required: true
                description: >-
                  Written the same way for every award from that organisation,
                  since matching names are grouped together.
              - name: investigators
                label: Investigator(s)
                type: string
                required: true
                description: One line, e.g. "Wu Xu and Vijay Raghavan".
              - name: grant
                label: Grant / award number
                type: string
                required: true
                description: The identifier exactly as the funder writes it.
          - name: acknowledgmentsHeading
            label: Acknowledgments heading
            type: string
            description: >-
              Introduces the acknowledgment paragraphs inside the expanded
              panel, so they are not read as part of the award list.
          - name: acknowledgments
            label: Acknowledgments
            type: text
            list: true
            description: >-
              Ordinary prose, one entry per paragraph. People to thank for
              computing support, data preparation and similar help — award
              numbers belong in Funding awards above, not here.
      - name: contact
        label: Closing section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Text
            type: text
            required: true
          - name: cta
            label: Button label
            type: string
            required: true
            description: >-
              Opens a new email to the group's public address, which is set in
              Site settings.

  # -------------------------------------------------------------------------
  # Publications and People page wording
  # -------------------------------------------------------------------------
  # The headings and introductions of the two list pages. The lists themselves
  # come from the Publications and People collections above.
  - name: pages
    label: Page introductions
    type: file
    path: src/content/pages.json
    format: json
    fields:
      - name: publications
        label: Publications page
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
            description: Also used for the browser tab.
          - name: intro
            label: Introduction
            type: text
            required: true
      - name: people
        label: People page
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
            description: Also used for the browser tab.
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: currentHeading
            label: Heading for current members
            type: string
            required: true
          - name: formerHeading
            label: Heading for former members
            type: string
            required: true
      - name: software
        label: BioTSR page
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
            description: >-
              The page's main heading; also used for the browser tab.
          - name: eyebrow
            label: Small label above the title
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
            description: >-
              What BioTSR is. The version, dates, licence and links come from the BioTSR record in the Software collection; the installation, methods and documentation sections are the BioTSR page text under Software pages.
          - name: getStartedAction
            label: Getting started button
            type: string
            required: true
          - name: helpHeading
            label: Help heading
            type: string
            required: true
          - name: helpBody
            label: Help text
            type: text
            required: true
          - name: contactAction
            label: Contact link
            type: string
            required: true
          - name: citeHeading
            label: Citation heading
            type: string
            required: true
          - name: citeIntro
            label: Citation request
            type: text
            required: true
          - name: citeNote
            label: Note below the citation
            type: text
            required: true
          - name: licenceNote
            label: Licence note
            type: text
            required: true
            description: >-
              Name BioTSR's licence only. The research repositories each have their own terms.
          - name: figuresHeading
            label: Figures heading
            type: string
            required: true
          - name: figuresIntro
            label: Figures introduction
            type: text
            required: true
          - name: matrixTitle
            label: "Capability figure: title"
            type: string
            required: true
          - name: matrixAlt
            label: "Capability figure: description"
            type: text
            required: true
            description: >-
              Describes the figure for people who cannot see it. Update it whenever the figure changes.
          - name: matrixCaption
            label: "Capability figure: caption"
            type: text
            required: true
          - name: architectureTitle
            label: "Architecture figure: title"
            type: string
            required: true
          - name: architectureAlt
            label: "Architecture figure: description"
            type: text
            required: true
            description: >-
              Describes the figure for people who cannot see it. Update it whenever the figure changes.
          - name: architectureCaption
            label: "Architecture figure: caption"
            type: text
            required: true
          - name: researchCodeHeading
            label: "Earlier implementations section: heading"
            type: string
            required: true
          - name: researchCodeIntro
            label: "Earlier implementations section: text"
            type: text
            required: true
            description: >-
              A short pointer. The repositories themselves are listed on the Earlier implementations and research code page.
          - name: researchCodeAction
            label: "Earlier implementations section: link label"
            type: string
            required: true
      - name: research
        label: Methods & research page
        type: object
        fields:
          - name: title
            label: "Page title"
            type: string
            required: true
            description: >-
              Also used for the browser tab. The menu label is set in code.
          - name: intro
            label: "Introduction"
            type: text
            required: true
          - name: coreNote
            label: "Line before the TSR method link"
            type: string
            required: true
          - name: coreAction
            label: "TSR method link label"
            type: string
            required: true
          - name: methodsHeading
            label: "Scientific methods heading"
            type: string
            required: true
          - name: methodsIntro
            label: "Scientific methods introduction"
            type: text
            required: true
            description: >-
              The method pages are listed automatically, so there is no list to maintain here.
          - name: analysisHeading
            label: "Analysis heading"
            type: string
            required: true
          - name: analysisIntro
            label: "Analysis introduction"
            type: text
            required: true
          - name: earlierHeading
            label: "Earlier implementations heading"
            type: string
            required: true
          - name: earlierIntro
            label: "Earlier implementations introduction"
            type: text
            required: true
          - name: earlierAction
            label: "Earlier implementations link label"
            type: string
            required: true
      - name: earlierImplementations
        label: Earlier implementations and research code page
        type: object
        fields:
          - name: title
            label: "Page title"
            type: string
            required: true
            description: >-
              Also used for the browser tab.
          - name: intro
            label: "Introduction"
            type: text
            required: true
          - name: biotsrNote
            label: "BioTSR recommendation"
            type: text
            required: true
            description: >-
              One or two sentences in the box under the introduction, beside
              the button to the BioTSR page.
          - name: biotsrAction
            label: "BioTSR link label"
            type: string
            required: true
          - name: historicalHeading
            label: "Earlier implementations heading"
            type: string
            required: true
          - name: historicalIntro
            label: "Earlier implementations introduction"
            type: text
            required: true
          - name: toolsHeading
            label: "Research tools heading"
            type: string
            required: true
          - name: toolsIntro
            label: "Research tools introduction"
            type: text
            required: true
