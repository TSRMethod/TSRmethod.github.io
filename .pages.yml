# Pages CMS configuration — https://pagescms.org
#
# This file decides what a non-technical editor can change through the CMS at
# app.pagescms.org, and — just as importantly — what they cannot.
#
# ---------------------------------------------------------------------------
# The safety boundary
# ---------------------------------------------------------------------------
# The supervisor controls CONTENT. They do not control ARCHITECTURE.
#
# Fields that decide a page's URL, which menu it appears under, or whether it
# is published are marked `hidden: true`. Hidden fields are still part of the
# schema, so their values are read and written back untouched — they simply
# never appear in the editor. Combined with `settings.content.merge` below,
# that means a save can never drop or alter them.
#
# In particular `status` (published/draft) is NOT editable here. Publishing a
# method whose science has not been reviewed must stay a maintainer action
# performed in the repository. See CONTENT-REVIEW.md.
#
# ---------------------------------------------------------------------------
# Adding a new content type
# ---------------------------------------------------------------------------
# See the "Extending the CMS schema" section of src/content/README.md.

media:
  # Where uploads are stored in the repository...
  input: public/images/uploads
  # ...and the URL written into content. The site is served from the domain
  # root (Vite `base: "/"`), so an absolute path is correct and will resolve
  # both locally and on GitHub Pages.
  output: /images/uploads
  categories: [image]
  extensions: [png, jpg, jpeg, webp, svg]
  # Slugify uploaded filenames: spaces and accents in a filename break URLs.
  rename: safe

settings:
  content:
    # Preserve any key that is not declared in a schema below. Without this,
    # Pages CMS rewrites a file from the schema alone and silently deletes
    # everything it was not told about. This is the single most important
    # setting in this file.
    merge: true
  commit:
    templates:
      create: 'Add {path} (via Pages CMS)'
      update: 'Update {path} (via Pages CMS)'
      delete: 'Remove {path} (via Pages CMS)'

content:
  # -------------------------------------------------------------------------
  # Method and tutorial pages
  # -------------------------------------------------------------------------
  # An editor MAY create a new method draft, but creating one does not publish
  # it. A new file arrives with editorial content only; `status` is absent,
  # which the content loader reads as draft, so the page has no route and
  # appears in no menu until a maintainer assigns its category, group and
  # status in the repository.
  #
  # Rename stays disabled: the filename determines the page's URL, so renaming
  # would silently move a published page. Delete stays disabled so scientific
  # content cannot be lost by accident.
  - name: methods
    label: Method & tutorial pages
    type: collection
    path: src/content/methods
    format: yaml-frontmatter
    # The filename is generated by slugifying the primary field (title), so
    # "VCNN-TSR" becomes vcnn-tsr.md. `field: false` keeps the raw filename
    # box out of the editor — the title is the only thing to fill in.
    filename:
      template: '{primary}.md'
      field: false
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, summary]
    fields:
      # ---- Architecture: hidden, preserved, never editable here ----
      # Declared so existing values round-trip untouched on save. On a newly
      # created page these are absent or empty, which the content loader
      # treats as "unpublished draft, not yet placed".
      - name: slug
        type: string
        hidden: true
      - name: category
        type: string
        hidden: true
      - name: group
        type: string
        hidden: true
      - name: order
        type: number
        hidden: true
      - name: status
        type: string
        hidden: true

      # ---- Editorial ----
      - name: title
        label: Title
        type: string
        required: true
        description: The main heading, and the name used in listings.
      - name: shortTitle
        label: Short title
        type: string
        description: Optional shorter label used in the navigation menu.
      - name: summary
        label: Summary
        type: text
        required: true
        description: One or two sentences describing the method.

      - name: figure
        label: Main illustration
        type: object
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: text
            description: >-
              Describe what the image shows, for readers using a screen
              reader. Required whenever an image is set — the site will fail
              to build without it.
          - name: caption
            label: Caption
            type: string
            description: Optional caption shown beneath the image.

      - name: paper
        label: Publication
        type: object
        fields:
          - name: title
            label: Paper title
            type: text
          - name: authors
            label: Authors
            type: string
          - name: journal
            label: Journal
            type: string
          - name: year
            label: Year
            type: number
          - name: volume
            label: Volume
            type: string
          - name: issue
            label: Issue
            type: string
          - name: pages
            label: Pages
            type: string
            description: 'For example: 694–703'
          - name: doi
            label: DOI
            type: string
            description: 'For example: 10.3389/fchem.2020.602291 (no https:// prefix).'

      - name: repositories
        label: Code repositories
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: URL
            type: string
          - name: description
            label: Description
            type: text
          - name: language
            label: Language
            type: string

      - name: slurm
        label: HPC / Slurm instructions
        type: object
        description: >-
          Leave empty if this package is not run on the cluster. Everything
          here is specific to this package — the site supplies only the
          layout.
        fields:
          - name: intro
            label: Introduction
            type: text
            description: A sentence or two before the job script.
          - name: script
            label: Job script
            type: object
            fields:
              - name: filename
                label: File name
                type: string
                description: 'For example: run_tsr.sbatch'
              - name: code
                label: Script
                type: text
                description: >-
                  The full job script, exactly as it should be run. Line
                  breaks and indentation are preserved.
          - name: submit
            label: Submission command
            type: object
            fields:
              - name: code
                label: Command
                type: string
                description: 'For example: sbatch run_tsr.sbatch'
          - name: resources
            label: Resource notes
            type: text
            description: What the job requests, and what an editor may need to change.
          - name: notes
            label: Additional notes
            type: text

      - name: references
        label: Further reading
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: URL
            type: string

      - name: review
        label: Review notice
        type: object
        description: >-
          Shows a highlighted "under review" banner at the top of the page.
        fields:
          - name: note
            label: Note
            type: text

      # ---- The page itself ----
      # `format: markdown` keeps the file as plain Markdown rather than HTML,
      # which is what the site renders and what keeps the file readable in
      # the repository. The editor gets a formatting toolbar and can switch
      # to source view.
      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown

  - name: analysis
    label: Key Analysis & Visualization
    type: collection
    path: src/content/analysis
    format: yaml-frontmatter
    # The filename is generated by slugifying the primary field (title), so
    # "VCNN-TSR" becomes vcnn-tsr.md. `field: false` keeps the raw filename
    # box out of the editor — the title is the only thing to fill in.
    filename:
      template: '{primary}.md'
      field: false
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, summary]
    fields:
      # ---- Architecture: hidden, preserved, never editable here ----
      # Declared so existing values round-trip untouched on save. On a newly
      # created page these are absent or empty, which the content loader
      # treats as "unpublished draft, not yet placed".
      - name: slug
        type: string
        hidden: true
      - name: category
        type: string
        hidden: true
      - name: group
        type: string
        hidden: true
      - name: order
        type: number
        hidden: true
      - name: status
        type: string
        hidden: true

      # ---- Editorial ----
      - name: title
        label: Title
        type: string
        required: true
        description: The main heading, and the name used in listings.
      - name: shortTitle
        label: Short title
        type: string
        description: Optional shorter label used in the navigation menu.
      - name: summary
        label: Summary
        type: text
        required: true
        description: One or two sentences describing the method.

      - name: figure
        label: Main illustration
        type: object
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: text
            description: >-
              Describe what the image shows, for readers using a screen
              reader. Required whenever an image is set — the site will fail
              to build without it.
          - name: caption
            label: Caption
            type: string
            description: Optional caption shown beneath the image.

      - name: paper
        label: Publication
        type: object
        fields:
          - name: title
            label: Paper title
            type: text
          - name: authors
            label: Authors
            type: string
          - name: journal
            label: Journal
            type: string
          - name: year
            label: Year
            type: number
          - name: volume
            label: Volume
            type: string
          - name: issue
            label: Issue
            type: string
          - name: pages
            label: Pages
            type: string
            description: 'For example: 694–703'
          - name: doi
            label: DOI
            type: string
            description: 'For example: 10.3389/fchem.2020.602291 (no https:// prefix).'

      - name: repositories
        label: Code repositories
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: URL
            type: string
          - name: description
            label: Description
            type: text
          - name: language
            label: Language
            type: string

      - name: slurm
        label: HPC / Slurm instructions
        type: object
        description: >-
          Leave empty if this package is not run on the cluster. Everything
          here is specific to this package — the site supplies only the
          layout.
        fields:
          - name: intro
            label: Introduction
            type: text
            description: A sentence or two before the job script.
          - name: script
            label: Job script
            type: object
            fields:
              - name: filename
                label: File name
                type: string
                description: 'For example: run_tsr.sbatch'
              - name: code
                label: Script
                type: text
                description: >-
                  The full job script, exactly as it should be run. Line
                  breaks and indentation are preserved.
          - name: submit
            label: Submission command
            type: object
            fields:
              - name: code
                label: Command
                type: string
                description: 'For example: sbatch run_tsr.sbatch'
          - name: resources
            label: Resource notes
            type: text
            description: What the job requests, and what an editor may need to change.
          - name: notes
            label: Additional notes
            type: text

      - name: references
        label: Further reading
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: URL
            type: string

      - name: review
        label: Review notice
        type: object
        description: >-
          Shows a highlighted "under review" banner at the top of the page.
        fields:
          - name: note
            label: Note
            type: text

      # ---- The page itself ----
      # `format: markdown` keeps the file as plain Markdown rather than HTML,
      # which is what the site renders and what keeps the file readable in
      # the repository. The editor gets a formatting toolbar and can switch
      # to source view.
      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown

  # -------------------------------------------------------------------------
  # People
  # -------------------------------------------------------------------------
  - name: people
    label: People
    type: collection
    path: src/content/people
    format: json
    filename: '{fields.id}.json'
    view:
      primary: name
      fields: [name, role, status]
    fields:
      - name: id
        label: Identifier
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: >-
          Lowercase, words joined by hyphens, e.g. jane-smith. Used as the
          file name. Do not change it once the person has been added.
      - name: name
        label: Full name
        type: string
        required: true
      - name: role
        label: Role or title
        type: string
        required: true
      - name: affiliation
        label: Affiliation
        type: string
      - name: group
        label: Group
        type: select
        options:
          values: [faculty, postdoc, student, undergraduate, collaborator]
      - name: status
        label: Current or former member
        type: select
        options:
          values: [current, former]
        default: current
      - name: bio
        label: Biography
        type: text
      - name: email
        label: Email
        type: string
        description: Leave empty if it should not be shown. Never enter a placeholder.
      - name: photo
        label: Photo
        type: image
      - name: order
        label: Sort position
        type: number
        description: Lower numbers appear first within a group.

  # -------------------------------------------------------------------------
  # Publications
  # -------------------------------------------------------------------------
  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: json
    filename: '{fields.id}.json'
    view:
      primary: title
      fields: [title, venue, year]
    fields:
      - name: id
        label: Identifier
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: >-
          Lowercase, hyphenated, e.g. kondra-2021-tsr-method. Used as the file
          name.
      - name: title
        label: Title
        type: text
        required: true
      - name: authors
        label: Authors
        type: string
        list: true
        description: One name per entry, in the order they appear on the paper.
      - name: venue
        label: Journal or conference
        type: string
      - name: year
        label: Year
        type: number
      - name: volume
        label: Volume
        type: string
      - name: issue
        label: Issue
        type: string
      - name: pages
        label: Pages
        type: string
        description: 'For example: 694–703'
      - name: doi
        label: DOI
        type: string
        description: 'For example: 10.1002/prot.26215 (no https:// prefix).'
      - name: abstract
        label: Abstract
        type: text
        description: >-
          Optional. Shown behind an "Abstract" toggle on the publications page.
          Leave it empty rather than pasting a placeholder.
      - name: order
        label: Sort position
        type: number
        description: >-
          Optional. Only used to order papers published in the same year;
          the list is always newest year first.

  # -------------------------------------------------------------------------
  # Software repositories
  # -------------------------------------------------------------------------
  - name: repositories
    label: Software
    type: collection
    path: src/content/repositories
    format: json
    filename: '{fields.id}.json'
    view:
      primary: name
      fields: [name, language, category]
    fields:
      - name: id
        label: Identifier
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      - name: name
        label: Repository name
        type: string
        required: true
      - name: url
        label: URL
        type: string
        required: true
        description: >-
          The repository's address on GitHub. Changing it here is all that is
          needed to point an entry at a different repository — including moving
          the main package to a new account or organisation later.
      - name: description
        label: Description
        type: text
        description: >-
          One or two sentences on what the code does. The software page is a
          directory, not a manual — installation and usage stay on the method
          pages.
      - name: language
        label: Language
        type: string
      - name: category
        label: Category
        type: select
        options:
          values: [core, method, analysis, tooling]
        description: >-
          Which section of the software page the entry appears under: core is
          the main TSR software, method is the specialised packages, analysis
          is the tools that work on generated keys.
      - name: kind
        label: What it is
        type: select
        options:
          values: [package, scripts]
        description: >-
          "package" for something a user installs, "scripts" for research code
          that is run where it sits. Shown on the entry, so nothing implies a
          maintained release where there is not one.
      - name: issuesUrl
        label: Issue tracker
        type: string
        description: >-
          Optional, and a commitment: setting it puts a "Report a problem" link
          on the entry, so only fill it in for a repository whose issues
          somebody actually reads.
      - name: order
        label: Sort position
        type: number
        description: Lower numbers appear first within a section.

  # -------------------------------------------------------------------------
  # Home page wording
  # -------------------------------------------------------------------------
  # What the home page SAYS. Not how it is built.
  #
  # There is deliberately no field here for a link target, a section order, a
  # component name or a colour: the sections, their links and their layout are
  # decided in React, and every list on the page (methods, tools, packages,
  # papers, faculty) is read from the content collections above. An editor
  # rewrites the prose and the button labels; they cannot point a button at a
  # page that does not exist, reorder the page, or turn this into a page
  # builder.
  #
  # Every field is required, because each one renders as visible text — an
  # emptied heading or button label would appear on the site as a blank. The
  # build fails instead, which means a bad save never reaches the live site.
  - name: home
    label: Home page
    type: file
    path: src/content/home.json
    format: json
    fields:
      - name: hero
        label: Opening section
        type: object
        fields:
          - name: lede
            label: Introduction
            type: text
            required: true
            description: >-
              The paragraph under the group name. Two or three sentences saying
              what the group does.
          - name: primaryCta
            label: Main button label
            type: string
            required: true
            description: Links to the TSR method page.
          - name: secondaryCta
            label: Second button label
            type: string
            required: true
            description: Jumps to the list of methods further down the page.
      - name: introduction
        label: What TSR is
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Explanation
            type: text
            required: true
            description: >-
              A short summary only. The full method and tutorial live on the
              TSR method page, and this should not repeat them.
          - name: cta
            label: Link label
            type: string
            required: true
            description: Links to the TSR method page.
          - name: figure
            label: Diagram
            type: object
            fields:
              - name: src
                label: Image
                type: image
              - name: alt
                label: Alt text
                type: text
                description: >-
                  What the diagram shows, in a sentence. This is what a screen
                  reader reads in place of the picture, so describe the
                  content rather than naming the file.
              - name: caption
                label: Caption
                type: string
      - name: methods
        label: TSR-based methods section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
            description: >-
              The methods themselves are listed automatically from the method
              pages, so there is no list to maintain here.
      - name: analysis
        label: Key analysis section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
      - name: software
        label: Software section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
            description: >-
              The repositories are listed automatically from the Software
              collection.
      - name: publications
        label: Publications section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: cta
            label: Link label
            type: string
            required: true
            description: >-
              Links to the publications page. The three most recent papers are
              chosen automatically by year.
      - name: group
        label: Research group section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: cta
            label: Link label
            type: string
            required: true
            description: Links to the people page.
      - name: contact
        label: Closing section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Text
            type: text
            required: true
          - name: cta
            label: Button label
            type: string
            required: true
            description: >-
              Opens a new email to the group's public address, which is set in
              Site settings.

  # -------------------------------------------------------------------------
  # Publications and People page wording
  # -------------------------------------------------------------------------
  # The headings and introductions of the two list pages. The lists themselves
  # come from the Publications and People collections above.
  - name: pages
    label: Page introductions
    type: file
    path: src/content/pages.json
    format: json
    fields:
      - name: publications
        label: Publications page
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
            description: Also used for the browser tab.
          - name: intro
            label: Introduction
            type: text
            required: true
      - name: people
        label: People page
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
            description: Also used for the browser tab.
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: currentHeading
            label: Heading for current members
            type: string
            required: true
          - name: formerHeading
            label: Heading for former members
            type: string
            required: true
      - name: software
        label: Software page
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
            description: Also used for the browser tab.
          - name: intro
            label: Introduction
            type: text
            required: true
            description: >-
              The repositories themselves come from the Software collection, so
              there is no list to keep up to date here.
          - name: note
            label: Highlighted note
            type: text
            required: true
            description: >-
              The short caveat in the tinted box, currently explaining that the
              code is spread across several repositories.
      - name: contact
        label: Contact page
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
            description: Also used for the browser tab.
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: emailHeading
            label: Email section heading
            type: string
            required: true
          - name: emailAction
            label: Email button label
            type: string
            required: true
            description: >-
              Opens a new message to the group's public address, which is set
              in Site settings. The address itself is not repeated here.
          - name: collaborationHeading
            label: Research section heading
            type: string
            required: true
          - name: collaborationBody
            label: Research section text
            type: text
            required: true
          - name: softwareHeading
            label: Software section heading
            type: string
            required: true
          - name: softwareBody
            label: Software section text
            type: text
            required: true
            description: >-
              Where to report a problem with the code. Individual repositories
              are listed on the software page, not named here.
          - name: affiliationHeading
            label: Affiliation section heading
            type: string
            required: true
            description: >-
              The affiliations listed under it are the ones in Site settings.

  # -------------------------------------------------------------------------
  # Site settings — editorial only
  # -------------------------------------------------------------------------
  # Technical configuration (GitHub organisation, repository URLs, issue
  # tracker, deployment origin) lives in src/app/siteConfig.js and is
  # deliberately absent here.
  - name: site
    label: Site settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: name
        label: Group name
        type: string
        required: true
        description: Shown in the header, the footer and the browser tab.
      - name: shortName
        label: Short name
        type: string
      - name: tagline
        label: Tagline
        type: string
        description: One short line, shown in the footer.
      - name: description
        label: Description
        type: text
        required: true
        description: >-
          One or two sentences, used by search engines and link previews. The
          wording shown on the home page itself is under "Home page".
      - name: email
        label: Public contact email
        type: string
        required: true
        description: >-
          The group's public address. Changing it here changes it everywhere
          on the site.
      - name: affiliations
        label: Affiliations
        type: object
        list: true
        fields:
          - name: id
            label: Identifier
            type: string
          - name: name
            label: Name
            type: string
          - name: url
            label: URL
            type: string
