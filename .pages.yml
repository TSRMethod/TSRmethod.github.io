# Pages CMS configuration — https://pagescms.org
#
# This file decides what a non-technical editor can change through the CMS at
# app.pagescms.org, and — just as importantly — what they cannot.
#
# ---------------------------------------------------------------------------
# The safety boundary
# ---------------------------------------------------------------------------
# The supervisor controls CONTENT. They do not control ARCHITECTURE.
#
# Fields that decide a page's URL, which menu it appears under, or whether it
# is published are marked `hidden: true`. Hidden fields are still part of the
# schema, so their values are read and written back untouched — they simply
# never appear in the editor. Combined with `settings.content.merge` below,
# that means a save can never drop or alter them.
#
# In particular `status` (published/draft) is NOT editable here. Publishing a
# method whose science has not been reviewed must stay a maintainer action
# performed in the repository. See CONTENT-REVIEW.md.
#
# ---------------------------------------------------------------------------
# Adding a new content type
# ---------------------------------------------------------------------------
# See the "Extending the CMS schema" section of src/content/README.md.

media:
  # Where uploads are stored in the repository...
  input: public/images/uploads
  # ...and the URL written into content. The site is served from the domain
  # root (Vite `base: "/"`), so an absolute path is correct and will resolve
  # both locally and on GitHub Pages.
  output: /images/uploads
  categories: [image]
  extensions: [png, jpg, jpeg, webp, svg]
  # Slugify uploaded filenames: spaces and accents in a filename break URLs.
  rename: safe

settings:
  content:
    # Preserve any key that is not declared in a schema below. Without this,
    # Pages CMS rewrites a file from the schema alone and silently deletes
    # everything it was not told about. This is the single most important
    # setting in this file.
    merge: true
  commit:
    templates:
      create: 'Add {path} (via Pages CMS)'
      update: 'Update {path} (via Pages CMS)'
      delete: 'Remove {path} (via Pages CMS)'

content:
  # -------------------------------------------------------------------------
  # Method and tutorial pages
  # -------------------------------------------------------------------------
  # Edit-only. Creating a method page means choosing a URL, a menu group and a
  # publication status, all of which are architectural, so a new page stays a
  # developer task. Renaming would break the slug/filename agreement the
  # content loader enforces.
  - name: methods
    label: Method & tutorial pages
    type: collection
    path: src/content/methods
    format: yaml-frontmatter
    filename: '{primary}.md'
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, summary]
    fields:
      # ---- Architecture: hidden, preserved, never editable here ----
      - name: slug
        type: string
        hidden: true
      - name: category
        type: string
        hidden: true
      - name: group
        type: string
        hidden: true
      - name: order
        type: number
        hidden: true
      - name: status
        type: string
        hidden: true

      # ---- Editorial ----
      - name: title
        label: Title
        type: string
        required: true
        description: The main heading, and the name used in listings.
      - name: shortTitle
        label: Short title
        type: string
        description: Optional shorter label used in the navigation menu.
      - name: summary
        label: Summary
        type: text
        required: true
        description: One or two sentences describing the method.

      - name: figure
        label: Main illustration
        type: object
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: text
            description: >-
              Describe what the image shows, for readers using a screen
              reader. Required whenever an image is set — the site will fail
              to build without it.
          - name: caption
            label: Caption
            type: string
            description: Optional caption shown beneath the image.

      - name: paper
        label: Publication
        type: object
        fields:
          - name: title
            label: Paper title
            type: text
          - name: authors
            label: Authors
            type: string
          - name: journal
            label: Journal
            type: string
          - name: year
            label: Year
            type: number
          - name: doi
            label: DOI
            type: string
            description: 'For example: 10.3389/fchem.2020.602291 (no https:// prefix).'

      - name: repositories
        label: Code repositories
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: URL
            type: string
          - name: description
            label: Description
            type: text
          - name: language
            label: Language
            type: string

      - name: slurm
        label: HPC / Slurm instructions
        type: object
        description: >-
          Leave empty if this package is not run on the cluster. Everything
          here is specific to this package — the site supplies only the
          layout.
        fields:
          - name: intro
            label: Introduction
            type: text
            description: A sentence or two before the job script.
          - name: script
            label: Job script
            type: object
            fields:
              - name: filename
                label: File name
                type: string
                description: 'For example: run_tsr.sbatch'
              - name: code
                label: Script
                type: text
                description: >-
                  The full job script, exactly as it should be run. Line
                  breaks and indentation are preserved.
          - name: submit
            label: Submission command
            type: object
            fields:
              - name: code
                label: Command
                type: string
                description: 'For example: sbatch run_tsr.sbatch'
          - name: resources
            label: Resource notes
            type: text
            description: What the job requests, and what an editor may need to change.
          - name: notes
            label: Additional notes
            type: text

      - name: references
        label: Further reading
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: URL
            type: string

      - name: review
        label: Review notice
        type: object
        description: >-
          Shows a highlighted "under review" banner at the top of the page.
        fields:
          - name: note
            label: Note
            type: text

      # ---- The page itself ----
      # `format: markdown` keeps the file as plain Markdown rather than HTML,
      # which is what the site renders and what keeps the file readable in
      # the repository. The editor gets a formatting toolbar and can switch
      # to source view.
      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown

  # -------------------------------------------------------------------------
  # People
  # -------------------------------------------------------------------------
  - name: people
    label: People
    type: collection
    path: src/content/people
    format: json
    filename: '{fields.id}.json'
    view:
      primary: name
      fields: [name, role, status]
    fields:
      - name: id
        label: Identifier
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: >-
          Lowercase, words joined by hyphens, e.g. jane-smith. Used as the
          file name. Do not change it once the person has been added.
      - name: name
        label: Full name
        type: string
        required: true
      - name: role
        label: Role or title
        type: string
        required: true
      - name: affiliation
        label: Affiliation
        type: string
      - name: group
        label: Group
        type: select
        options:
          values: [faculty, postdoc, student, undergraduate, collaborator]
      - name: status
        label: Current or former member
        type: select
        options:
          values: [current, former]
        default: current
      - name: bio
        label: Biography
        type: text
      - name: email
        label: Email
        type: string
        description: Leave empty if it should not be shown. Never enter a placeholder.
      - name: photo
        label: Photo
        type: image
      - name: order
        label: Sort position
        type: number
        description: Lower numbers appear first within a group.

  # -------------------------------------------------------------------------
  # Publications
  # -------------------------------------------------------------------------
  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: json
    filename: '{fields.id}.json'
    view:
      primary: title
      fields: [title, venue, year]
    fields:
      - name: id
        label: Identifier
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description: >-
          Lowercase, hyphenated, e.g. kondra-2021-tsr-method. Used as the file
          name.
      - name: title
        label: Title
        type: text
        required: true
      - name: authors
        label: Authors
        type: string
        list: true
        description: One name per entry, in the order they appear on the paper.
      - name: venue
        label: Journal or conference
        type: string
      - name: year
        label: Year
        type: number
      - name: doi
        label: DOI
        type: string
        description: 'For example: 10.1002/prot.26215 (no https:// prefix).'
      - name: abstract
        label: Abstract
        type: text

  # -------------------------------------------------------------------------
  # Software repositories
  # -------------------------------------------------------------------------
  - name: repositories
    label: Software
    type: collection
    path: src/content/repositories
    format: json
    filename: '{fields.id}.json'
    view:
      primary: name
      fields: [name, language, category]
    fields:
      - name: id
        label: Identifier
        type: string
        required: true
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      - name: name
        label: Repository name
        type: string
        required: true
      - name: url
        label: URL
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: language
        label: Language
        type: string
      - name: category
        label: Category
        type: select
        options:
          values: [core, method, analysis, tooling]
      - name: order
        label: Sort position
        type: number

  # -------------------------------------------------------------------------
  # Site settings — editorial only
  # -------------------------------------------------------------------------
  # Technical configuration (GitHub organisation, repository URLs, issue
  # tracker, deployment origin) lives in src/app/siteConfig.js and is
  # deliberately absent here.
  - name: site
    label: Site settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: name
        label: Group name
        type: string
        required: true
        description: Shown in the header, the footer and the browser tab.
      - name: shortName
        label: Short name
        type: string
      - name: tagline
        label: Tagline
        type: string
        description: One short line, shown in the footer.
      - name: description
        label: Description
        type: text
        required: true
        description: >-
          One or two sentences. Used on the home page and by search engines.
      - name: email
        label: Public contact email
        type: string
        required: true
        description: >-
          The group's public address. Changing it here changes it everywhere
          on the site.
      - name: affiliations
        label: Affiliations
        type: object
        list: true
        fields:
          - name: id
            label: Identifier
            type: string
          - name: name
            label: Name
            type: string
          - name: url
            label: URL
            type: string
