      - name: contact
        label: Contact page
        type: object
        fields:
          - name: title
            label: Page title
            type: string
            required: true
            description: Also used for the browser tab.
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: emailHeading
            label: Email section heading
            type: string
            required: true
          - name: emailAction
            label: Email button label
