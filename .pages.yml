# Pages CMS configuration — https://pagescms.org
#
# This file decides what a non-technical editor can change through the CMS at
# app.pagescms.org, and — just as importantly — what they cannot.
#
# ---------------------------------------------------------------------------
# The safety boundary
# ---------------------------------------------------------------------------
# The supervisor controls CONTENT. They do not control ARCHITECTURE.
#
# Fields that decide a page's URL, which menu it appears under, or whether it
# is published are marked `hidden: true`. Hidden fields are still part of the
# schema, so their values are read and written back untouched — they simply
# never appear in the editor. Combined with `settings.content.merge` below,
# that means a save can never drop or alter them.
#
# In particular `status` (published/draft) is NOT editable here. Publishing a
# method whose science has not been reviewed must stay a maintainer action
# performed in the repository. See CONTENT-REVIEW.md.
#
# ---------------------------------------------------------------------------
# Adding a new content type
# ---------------------------------------------------------------------------
# See the "Extending the CMS schema" section of src/content/README.md.

media:
  # Where uploads are stored in the repository...
  input: public/images/uploads
  # ...and the URL written into content. The site is served from the domain
  # root (Vite `base: "/"`), so an absolute path is correct and will resolve
  # both locally and on GitHub Pages.
  output: /images/uploads
  categories: [image]
  extensions: [png, jpg, jpeg, webp, svg]
  # Slugify uploaded filenames: spaces and accents in a filename break URLs.
  rename: safe

settings:
  content:
    # Preserve any key that is not declared in a schema below. Without this,
    # Pages CMS rewrites a file from the schema alone and silently deletes
    # everything it was not told about. This is the single most important
    # setting in this file.
    merge: true
  commit:
    templates:
      create: 'Add {path} (via Pages CMS)'
      update: 'Update {path} (via Pages CMS)'
      delete: 'Remove {path} (via Pages CMS)'

content:
  # -------------------------------------------------------------------------
  # Method and tutorial pages
  # -------------------------------------------------------------------------
  # An editor MAY create a new method draft, but creating one does not publish
  # it. A new file arrives with editorial content only; `status` is absent,
  # which the content loader reads as draft, so the page has no route and
  # appears in no menu until a maintainer assigns its category, group and
  # status in the repository.
  #
  # Rename stays disabled: the filename determines the page's URL, so renaming
  # would silently move a published page. Delete stays disabled so scientific
  # content cannot be lost by accident.
  - name: methods
    label: Method & tutorial pages
    type: collection
    path: src/content/methods
    format: yaml-frontmatter
    # The filename is generated by slugifying the primary field (title), so
    # "VCNN-TSR" becomes vcnn-tsr.md. `field: false` keeps the raw filename
    # box out of the editor — the title is the only thing to fill in.
    filename:
      template: '{primary}.md'
      field: false
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, summary]
    fields:
      # ---- Architecture: hidden, preserved, never editable here ----
      # Declared so existing values round-trip untouched on save. On a newly
      # created page these are absent or empty, which the content loader
      # treats as "unpublished draft, not yet placed".
      - name: slug
        type: string
        hidden: true
      - name: category
        type: string
        hidden: true
      - name: group
        type: string
        hidden: true
      - name: order
        type: number
        hidden: true
      - name: status
        type: string
        hidden: true
      # Which site-drawn figure the page shows (for example tsr-overview).
      # An id of a component, so it is architecture, not copy.
      - name: diagram
        type: string
        hidden: true

      # ---- Editorial ----
      - name: title
        label: Title
        type: string
        required: true
        description: The main heading, and the name used in listings.
      - name: shortTitle
        label: Short title
        type: string
        description: Optional shorter label used in the navigation menu.
      - name: summary
        label: Summary
        type: text
        required: true
        description: One or two sentences describing the method.

      - name: figure
        label: Main illustration
        type: object
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: text
            description: >-
              Describe what the image shows, for readers using a screen
              reader. Required whenever an image is set — the site will fail
              to build without it.
          - name: caption
            label: Caption
            type: string
            description: Optional caption shown beneath the image.
          - name: credit
            label: Credit (figures from a publication)
            type: object
            description: >-
              Fill in only for a figure taken from a published paper. Source,
              link and licence are all required once any field is set.
            fields:
              - name: use
                label: Reproduced or adapted
                type: select
                options:
                  values: [reproduced, adapted]
              - name: source
                label: Source
                type: string
                description: Paper and figure, for example "Milon et al., Kinases and Phosphatases 2024, 2(4), 315–339, Figure 13".
              - name: url
                label: Link to the source
                type: string
                description: The paper's https://doi.org/ link.
              - name: copyright
                label: Copyright line
                type: string
                description: For example "© 2024 the authors".
              - name: licence
                label: Licence
                type: string
                description: For example "CC BY 4.0".
              - name: licenceUrl
                label: Licence link
                type: string
              - name: changes
                label: Changes made
                type: string
                description: What was changed, for example "Resized for the web; otherwise unchanged."

      - name: paper
        label: Publication
        type: object
        fields:
          - name: title
            label: Paper title
            type: text
          - name: authors
            label: Authors
            type: string
          - name: journal
            label: Journal
            type: string
          - name: year
            label: Year
            type: number
          - name: volume
            label: Volume
            type: string
          - name: issue
            label: Issue
            type: string
          - name: pages
            label: Pages
            type: string
            description: 'For example: 694–703'
          - name: doi
            label: DOI
            type: string
            description: 'For example: 10.3389/fchem.2020.602291 (no https:// prefix).'

      - name: repositories
        label: Code repositories
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: url
            label: URL
            type: string
          - name: description
            label: Description
            type: text
          - name: language
            label: Language
            type: string

      - name: slurm
        label: HPC / Slurm instructions
        type: object
        description: >-
          Leave empty if this package is not run on the cluster. Everything
          here is specific to this package — the site supplies only the
          layout.
        fields:
          - name: intro
            label: Introduction
            type: text
            description: A sentence or two before the job script.
          - name: script
            label: Job script
            type: object
            fields:
              - name: filename
                label: File name
                type: string
                description: 'For example: run_tsr.sbatch'
              - name: code
                label: Script
                type: text
                description: >-
                  The full job script, exactly as it should be run. Line
                  breaks and indentation are preserved.
          - name: submit
            label: Submission command
            type: object
            fields:
              - name: code
                label: Command
                type: string
                description: 'For example: sbatch run_tsr.sbatch'
          - name: resources
            label: Resource notes
            type: text
            description: What the job requests, and what an editor may need to change.
          - name: notes
            label: Additional notes
            type: text

      - name: references
        label: Further reading
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: url
            label: URL
            type: string

      - name: review
        label: Review notice
        type: object
        description: >-
          Shows a highlighted "under review" banner at the top of the page.
        fields:
          - name: note
            label: Note
            type: text

      # ---- The page itself ----
      # `format: markdown` keeps the file as plain Markdown rather than HTML,
      # which is what the site renders and what keeps the file readable in
      # the repository. The editor gets a formatting toolbar and can switch
      # to source view.
      - name: body
        label: Page content
        type: rich-text
        options:
          format: markdown

  - name: analysis
    label: Key Analysis & Visualization
    type: collection
    path: src/content/analysis
    format: yaml-frontmatter
    # The filename is generated by slugifying the primary field (title), so
    # "VCNN-TSR" becomes vcnn-tsr.md. `field: false` keeps the raw filename
