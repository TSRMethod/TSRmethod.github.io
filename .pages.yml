          - name: affiliationHeading
            label: Affiliation section heading
            type: string
            required: true
            description: >-
              The affiliations listed under it are the ones in Site settings.
          - name: shareHeading
            label: Share section heading
            type: string
            required: true
          - name: shareBody
            label: Share section text
            type: text
            required: true
            description: >-
              Shown beside the website's QR code. The code and its download
              files are fixed images in public/share and always open
              https://tsrmethod.github.io/.

  # -------------------------------------------------------------------------
  # Site settings — editorial only
  # -------------------------------------------------------------------------
  # Technical configuration (GitHub organisation, repository URLs, issue
  # tracker, deployment origin) lives in src/app/siteConfig.js and is
  # deliberately absent here.
  - name: site
    label: Site settings
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: name
        label: Group name
        type: string
        required: true
        description: Shown in the header, the footer and the browser tab.
      - name: shortName
        label: Short name
        type: string
      - name: tagline
        label: Tagline
        type: string
        description: One short line, shown in the footer.
      - name: description
        label: Description
        type: text
        required: true
        description: >-
          One or two sentences, used by search engines and link previews. The
          wording shown on the home page itself is under "Home page".
      - name: email
        label: Public contact email
        type: string
        required: true
        description: >-
          The group's public address. Changing it here changes it everywhere
          on the site.
      - name: affiliations
        label: Affiliations
        type: object
        list: true
        fields:
          - name: id
            label: Identifier
            type: string
          - name: name
            label: Name
            type: string
          - name: url
            label: URL
            type: string
