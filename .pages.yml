        label: Title
        type: string
        required: true
        description: The main heading, and the name used in listings.
      - name: shortTitle
        label: Short title
        type: string
        description: Optional shorter label used in the navigation menu.
      - name: summary
        label: Summary
        type: text
        required: true
        description: One or two sentences describing the method.

      - name: figure
        label: Main illustration
        type: object
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: text
            description: >-
              Describe what the image shows, for readers using a screen
              reader. Required whenever an image is set — the site will fail
              to build without it.
          - name: caption
            label: Caption
            type: string
            description: Optional caption shown beneath the image.
          - name: credit
            label: Credit (figures from a publication)
            type: object
            description: >-
              Fill in only for a figure taken from a published paper. Source,
              link and licence are all required once any field is set.
            fields:
              - name: use
                label: Reproduced or adapted
                type: select
                options:
                  values: [reproduced, adapted]
              - name: source
                label: Source
                type: string
                description: Paper and figure, for example "Milon et al., Kinases and Phosphatases 2024, 2(4), 315–339, Figure 13".
              - name: url
                label: Link to the source
                type: string
                description: The paper's https://doi.org/ link.
              - name: copyright
                label: Copyright line
                type: string
                description: For example "© 2024 the authors".
              - name: licence
                label: Licence
                type: string
                description: For example "CC BY 4.0".
              - name: licenceUrl
                label: Licence link
                type: string
              - name: changes
                label: Changes made
                type: string
                description: What was changed, for example "Resized for the web; otherwise unchanged."

      - name: paper
        label: Publication
        type: object
        fields:
          - name: title
            label: Paper title
            type: text
          - name: authors
            label: Authors
            type: string
          - name: journal
