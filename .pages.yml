      - name: slug
        type: string
        hidden: true
      - name: category
        type: string
        hidden: true
      - name: group
        type: string
        hidden: true
      - name: order
        type: number
        hidden: true
      - name: status
        type: string
        hidden: true
      # Which site-drawn figure the page shows (for example tsr-overview).
      # An id of a component, so it is architecture, not copy.
      - name: diagram
        type: string
        hidden: true

      # ---- Editorial ----
