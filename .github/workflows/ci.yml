# Validation for every change, before it can reach main.
#
# This is the gate that protects the live site: a pull request cannot be
# merged green unless lint, the test suite, content validation and the
# production build all succeed. Content edits made through Pages CMS are
# ordinary commits, so they pass through exactly the same checks.

name: CI

on:
  # The gate that matters: nothing reaches main without this passing.
  pull_request:
    branches: [main]

  # Work branches are validated as they are pushed, so a problem surfaces
  # while it is still being worked on rather than when the pull request is
  # opened.
  #
  # The prefixes are listed rather than using a bare `**` on purpose: a
  # wildcard would also build every throwaway experiment and every branch
  # pushed only for backup, which wastes minutes and trains people to ignore
  # red builds. These are the prefixes the project actually uses.
  #
  # The list grew after a hotfix on `fix/cms-people-photo-paths` got no push
  # CI at all — only `main` and `content/**` were covered, so a branch named
  # by our own convention was silently unverified until a PR existed. If you
  # start a branch with a new prefix, add it here.
  push:
    branches:
      - main
      - 'content/**'
      - 'fix/**'
      - 'polish/**'
      - 'feat/**'
      - 'chore/**'

# Read-only: this workflow only inspects the code.
permissions:
  contents: read

# One run per branch or pull request. Superseded runs are cancelled, which is
# safe here because nothing is published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version, shared with local
          # development. See also the "engines" field in package.json.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json specifies and fails if the two disagree.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build also validates content: every Markdown file is parsed and
      # checked, so a malformed page fails here rather than reaching the site.
      - name: Build
        run: npm run build

      - name: Check the SPA fallback was generated
        run: |
          # GitHub Pages serves 404.html for unknown paths. It must be a byte
          # copy of index.html, otherwise deep links such as /tsr would break.
          test -f dist/index.html
          test -f dist/404.html
          cmp dist/index.html dist/404.html
          test -f dist/.nojekyll
          echo "SPA fallback and .nojekyll present."
