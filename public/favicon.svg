<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TSR">
  <!--
    A deliberately simplified form of the group's mark: the triangle of three
    atoms, without the orbital rings, molecular graphs and structural formula
    that surround it in the full logo.

    Those details are what make the logo work at 500px and illegible at 16px,
    which is the size this is actually used at. The colours are sampled from
    the approved artwork so the two read as the same mark.
  -->
  <title>TSR Research Group</title>
  <g fill="none" stroke="#0f596f" stroke-width="7" stroke-linecap="round">
    <path d="M32 15 L13 47" />
    <path d="M32 15 L51 47" />
    <path d="M13 47 L51 47" />
  </g>
  <circle cx="32" cy="15" r="10" fill="#134168" />
  <circle cx="13" cy="47" r="10" fill="#54b8c9" />
  <circle cx="51" cy="47" r="10" fill="#2e797f" />
</svg>
