<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Site-level defaults, and the template for every page's HTML file. The
      build writes each page's own title, description, canonical and og: tags
      over these (scripts/prerender.mjs), and the app keeps them current as
      the reader moves between pages (src/hooks/usePageMetadata.js). Keep one
      of each: the build fails if it cannot find exactly one to replace.
    -->
    <title>TSR Research Group</title>
    <meta
      name="description"
      content="The Triangular Spatial Relationship (TSR) method: alignment-free comparison of 3D protein structures, TSR-derived methods, and the Python tools that implement them."
    />
    <link rel="canonical" href="https://tsrmethod.github.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TSR Research Group" />
    <meta property="og:title" content="TSR Research Group" />
    <meta
      property="og:description"
      content="The Triangular Spatial Relationship (TSR) method: alignment-free comparison of 3D protein structures, TSR-derived methods, and the Python tools that implement them."
    />
    <meta property="og:url" content="https://tsrmethod.github.io/" />
    <!--
      The social preview card, the same for every page: the group's mark,
      name and tagline, 1200 × 630, nothing that will date. It lives outside
      /images so the build's image optimiser leaves it exactly as committed.
      See CONTENT-REVIEW item 35.
    -->
    <meta property="og:image" content="https://tsrmethod.github.io/share/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TSR Research Group: alignment-free comparison of 3D protein structures."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0056b3" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
